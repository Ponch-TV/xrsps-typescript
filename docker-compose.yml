# Full production stack: game server, static client, and TLS.
#
# One hostname and one certificate carry everything the browser needs:
#
#   https://HOST/          the game client
#   wss://HOST/            game protocol
#   https://HOST/caches/   OSRS cache download
#   https://HOST/status    player count on the login screen's server list
#
# Browsers refuse a plaintext ws:// connection from an HTTPS page, so TLS is
# required rather than optional — Caddy handles it via Let's Encrypt.
#
#   cp .env.deploy.example .env.deploy && $EDITOR .env.deploy
#   docker compose --env-file .env.deploy up -d --build
#
# First boot downloads the OSRS cache and builds collision data (10-20 min)
# into named volumes; later restarts are immediate.
#
# Hosting the client on a CDN (Vercel, Pages) instead? This stack still works
# unchanged — see docs/deploy.md for the build-time variables the CDN needs.

services:
    game:
        build:
            context: .
            dockerfile: server/Dockerfile
        restart: unless-stopped
        environment:
            GAMEMODE: ${GAMEMODE:-vanilla}
            SERVER_NAME: ${SERVER_NAME:-xRSPS}
            HOST: 0.0.0.0
            PORT: 43594
            LOG_LEVEL: ${LOG_LEVEL:-info}
            # Set false once your characters exist to stop new signups.
            ALLOW_ACCOUNT_REGISTRATION: ${ALLOW_ACCOUNT_REGISTRATION:-true}
        volumes:
            - osrs-cache:/app/server/caches
            - collision-cache:/app/server/cache
            - player-data:/app/server/data
        # Not published to the host: only Caddy should reach it directly.
        expose:
            - "43594"

    # client/Dockerfile compiles the bundle and its final stage IS a Caddy image
    # with the bundle at /srv/client, so serving and building are one service.
    #
    # The game's hostname is baked into the bundle at build time (Create React
    # App inlines REACT_APP_*), so changing GAME_DOMAIN needs `up -d --build`,
    # not just a restart.
    caddy:
        build:
            context: .
            dockerfile: client/Dockerfile
            args:
                GAME_DOMAIN: ${GAME_DOMAIN:?set GAME_DOMAIN in .env.deploy}
                SERVER_NAME: ${SERVER_NAME:-xRSPS}
        depends_on:
            - game
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        environment:
            # The hostname you point at this box. Caddy gets a Let's Encrypt
            # cert for it automatically on first request.
            GAME_DOMAIN: ${GAME_DOMAIN:?set GAME_DOMAIN in .env.deploy}
            TLS_EMAIL: ${TLS_EMAIL:-}
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config

volumes:
    osrs-cache:
    collision-cache:
    player-data:
    caddy-data:
    caddy-config:
